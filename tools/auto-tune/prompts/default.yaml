- domain: code-edit
  id: code-edit-inventory-python
  prompt: |
    Here is a Python module that reads an inventory CSV file and prints a report:

    ```python
    import csv
    from dataclasses import dataclass


    @dataclass
    class Item:
        sku: str
        name: str
        quantity: int
        unit_price: float


    def load_items(path):
        items = []
        with open(path, newline="", encoding="utf-8") as f:
            reader = csv.DictReader(f)
            for row in reader:
                item = Item(
                    sku=row["sku"].strip(),
                    name=row["name"].strip(),
                    quantity=int(row["quantity"]),
                    unit_price=float(row["unit_price"]),
                )
                items.append(item)
        return items


    def total_value(items):
        return sum(i.quantity * i.unit_price for i in items)


    def low_stock(items, threshold=5):
        return [i for i in items if i.quantity < threshold]


    def format_report(items):
        lines = []
        for i in sorted(items, key=lambda x: x.sku):
            lines.append(f"{i.sku:<10} {i.name:<25} {i.quantity:>5} {i.unit_price:>10.2f}")
        lines.append(f"Total value: {total_value(items):.2f}")
        return "\n".join(lines)


    if __name__ == "__main__":
        import sys

        items = load_items(sys.argv[1])
        print(format_report(items))
        for i in low_stock(items):
            print(f"LOW: {i.sku}")
    ```

    Make these changes:
    1. Rename `load_items` to `read_inventory` and update every call site.
    2. If the file does not exist, print a clear message to stderr and exit with status 1.
    3. If a row has a missing or non-numeric `quantity` or `unit_price`, skip that row and print a warning to stderr that includes the line number from the CSV reader.

    Return the full updated file.

- domain: code-edit
  id: code-edit-http-client-js
  prompt: |
    Here is a small Node.js HTTP helper module (Node 18 or later):

    ```javascript
    // httpClient.js
    const DEFAULT_TIMEOUT_MS = 5000;
    const DEFAULT_RETRIES = 2;

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = DEFAULT_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function getJson(url, options = {}) {
      const res = await fetch(url, {
        headers: { Accept: "application/json", ...(options.headers || {}) },
      });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} for ${url}`);
      }
      return res.json();
    }

    async function getJsonRetry(url, options = {}) {
      let lastError;
      for (let attempt = 0; attempt <= DEFAULT_RETRIES; attempt++) {
        try {
          const res = await fetchWithTimeout(url, {
            headers: { Accept: "application/json" },
          });
          if (res.status >= 500) {
            throw new Error(`server error ${res.status}`);
          }
          if (!res.ok) {
            throw new Error(`HTTP ${res.status} for ${url}`);
          }
          return await res.json();
        } catch (err) {
          lastError = err;
          if (attempt < DEFAULT_RETRIES) {
            await sleep(200);
          }
        }
      }
      throw lastError;
    }

    function buildQuery(params) {
      const search = new URLSearchParams();
      for (const [key, value] of Object.entries(params)) {
        if (value !== undefined && value !== null) {
          search.append(key, String(value));
        }
      }
      return search.toString();
    }

    module.exports = {
      fetchWithTimeout,
      getJson,
      getJsonRetry,
      buildQuery,
      sleep,
    };
    ```

    Make these changes:
    1. Make the retry delay exponential: 200 ms before the first retry, doubling each time, capped at 2000 ms.
    2. Let `getJsonRetry` accept per-call `retries` and `timeoutMs` options that override the module constants. Pass the options through to the underlying request.
    3. Do not retry 4xx responses. Only network errors, timeouts and 5xx responses should be retried.
    4. Remove any export that nothing in the module uses.

    Return the full updated file.

- domain: code-edit
  id: code-edit-ring-buffer-c
  prompt: |
    Here is a byte ring buffer in C:

    ```c
    #include <stdbool.h>
    #include <stddef.h>
    #include <stdlib.h>
    #include <string.h>

    typedef struct {
        unsigned char *data;
        size_t capacity;
        size_t head;
        size_t tail;
        size_t count;
    } ring_buf;

    ring_buf *rb_create(size_t capacity) {
        ring_buf *rb = malloc(sizeof *rb);
        if (!rb) return NULL;
        rb->data = malloc(capacity);
        if (!rb->data) {
            free(rb);
            return NULL;
        }
        rb->capacity = capacity;
        rb->head = 0;
        rb->tail = 0;
        rb->count = 0;
        return rb;
    }

    void rb_destroy(ring_buf *rb) {
        if (!rb) return;
        free(rb->data);
        free(rb);
    }

    size_t rb_size(const ring_buf *rb) {
        return rb->count;
    }

    bool rb_push(ring_buf *rb, unsigned char byte) {
        if (rb->count == rb->capacity) return false;
        rb->data[rb->tail] = byte;
        rb->tail = (rb->tail + 1) % rb->capacity;
        rb->count++;
        return true;
    }

    bool rb_pop(ring_buf *rb, unsigned char *out) {
        if (rb->count == 0) return false;
        *out = rb->data[rb->head];
        rb->head = (rb->head + 1) % rb->capacity;
        rb->count--;
        return true;
    }

    size_t rb_write(ring_buf *rb, const unsigned char *src, size_t len) {
        size_t written = 0;
        while (written < len && rb_push(rb, src[written])) {
            written++;
        }
        return written;
    }

    size_t rb_read(ring_buf *rb, unsigned char *dst, size_t len) {
        size_t read = 0;
        unsigned char b;
        while (read < len && rb_pop(rb, &b)) {
            dst[read++] = b;
        }
        return read;
    }
    ```

    Make these changes:
    1. Add `bool rb_peek(const ring_buf *rb, size_t offset, unsigned char *out)`. It copies the byte at `offset` counted from the head, without removing it, and returns false if `offset` is out of range.
    2. Add `void rb_clear(ring_buf *rb)`.
    3. Make `rb_create` return NULL when `capacity` is 0.
    4. Make `rb_write` and `rb_read` copy in bulk with `memcpy` when the copied region does not wrap around the end of the buffer, and fall back to the byte loop otherwise.

    Return the full updated file.

- domain: code-edit
  id: code-edit-config-parser-rust
  prompt: |
    Here is a small Rust module that parses `key = value` config text:

    ```rust
    use std::collections::HashMap;
    use std::fs;
    use std::path::Path;

    #[derive(Debug, Clone, PartialEq)]
    pub enum Value {
        Text(String),
        Int(i64),
        Bool(bool),
    }

    pub fn parse_value(raw: &str) -> Value {
        let trimmed = raw.trim();
        if trimmed == "true" {
            return Value::Bool(true);
        }
        if trimmed == "false" {
            return Value::Bool(false);
        }
        if let Ok(n) = trimmed.parse::<i64>() {
            return Value::Int(n);
        }
        let unquoted = trimmed
            .strip_prefix('"')
            .and_then(|s| s.strip_suffix('"'))
            .unwrap_or(trimmed);
        Value::Text(unquoted.to_string())
    }

    pub fn parse_config(text: &str) -> HashMap<String, Value> {
        let mut map = HashMap::new();
        for line in text.lines() {
            let line = line.trim();
            if line.is_empty() || line.starts_with('#') {
                continue;
            }
            if let Some((key, value)) = line.split_once('=') {
                map.insert(key.trim().to_string(), parse_value(value));
            }
        }
        map
    }

    pub fn load_config(path: &Path) -> HashMap<String, Value> {
        let text = fs::read_to_string(path).unwrap_or_default();
        parse_config(&text)
    }

    pub fn get_int(map: &HashMap<String, Value>, key: &str) -> Option<i64> {
        match map.get(key) {
            Some(Value::Int(n)) => Some(*n),
            _ => None,
        }
    }

    #[cfg(test)]
    mod tests {
        use super::*;

        #[test]
        fn parses_basic_pairs() {
            let m = parse_config("port = 8080\nname = \"demo\"\n# comment\ndebug = true");
            assert_eq!(get_int(&m, "port"), Some(8080));
            assert_eq!(m.get("debug"), Some(&Value::Bool(true)));
        }
    }
    ```

    Make these changes:
    1. Change `parse_config` to return `Result<HashMap<String, Value>, ConfigError>`. A `ConfigError` must record the 1-based line number and the text of any non-empty, non-comment line that has no `=` sign.
    2. Implement `std::fmt::Display` for `ConfigError`.
    3. Change `load_config` to return a `Result` that propagates I/O errors instead of silently returning an empty map.
    4. Rename `get_int` to `get_i64`, and keep the existing test passing after the changes.

    Return the full updated file.

- domain: code-edit
  id: code-edit-backup-script-bash
  prompt: |
    Here is a Bash script that archives a directory and keeps only the newest archives:

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    SRC_DIR="${1:-}"
    DEST_ROOT="${BACKUP_ROOT:-$HOME/backups}"
    KEEP=7

    usage() {
      echo "usage: $(basename "$0") SOURCE_DIR" >&2
      exit 2
    }

    [[ -n "$SRC_DIR" ]] || usage
    [[ -d "$SRC_DIR" ]] || { echo "error: not a directory: $SRC_DIR" >&2; exit 1; }

    stamp="$(date +%Y%m%d-%H%M%S)"
    name="$(basename "$SRC_DIR")"
    dest="$DEST_ROOT/$name-$stamp.tar.gz"

    mkdir -p "$DEST_ROOT"
    echo "Creating $dest"
    tar -czf "$dest" -C "$(dirname "$SRC_DIR")" "$name"

    # Prune old archives for this source, keeping the newest $KEEP.
    shopt -s nullglob
    archives=("$DEST_ROOT/$name"-*.tar.gz)
    shopt -u nullglob

    count=${#archives[@]}
    if (( count > KEEP )); then
      mapfile -t sorted < <(printf '%s\n' "${archives[@]}" | sort)
      to_delete=$(( count - KEEP ))
      for (( i = 0; i < to_delete; i++ )); do
        echo "Removing ${sorted[$i]}"
        rm -f -- "${sorted[$i]}"
      done
    fi

    echo "Done. $(( count > KEEP ? KEEP : count )) archive(s) kept."
    ```

    Make these changes:
    1. Parse options with `getopts`. Add `-n` for dry-run mode: print what would be archived and removed, and do not touch the filesystem.
    2. Add `-k N` to override the number of archives kept. Reject a value that is not a positive integer with a message and exit status 2.
    3. Before doing anything else, check that `tar` is installed, and fail with a clear message if it is not.
    4. After creating the archive, print its size in human-readable form.

    Return the full updated script.

- domain: code-edit
  id: code-edit-token-bucket-python
  prompt: |
    Here is a Python token bucket rate limiter:

    ```python
    import threading
    import time


    class TokenBucket:
        """Allow up to `capacity` events in a burst, refilled at `rate` tokens per second."""

        def __init__(self, rate, capacity):
            if rate <= 0:
                raise ValueError("rate must be positive")
            if capacity <= 0:
                raise ValueError("capacity must be positive")
            self.rate = float(rate)
            self.capacity = float(capacity)
            self.tokens = float(capacity)
            self.updated = time.time()
            self._lock = threading.Lock()

        def _refill(self):
            now = time.time()
            elapsed = now - self.updated
            self.tokens = min(self.capacity, self.tokens + elapsed * self.rate)
            self.updated = now

        def try_acquire(self, n=1):
            with self._lock:
                self._refill()
                if self.tokens >= n:
                    self.tokens -= n
                    return True
                return False

        def wait_time(self, n=1):
            with self._lock:
                self._refill()
                deficit = n - self.tokens
                return max(0.0, deficit / self.rate)


    class KeyedLimiter:
        def __init__(self, rate, capacity):
            self._rate = rate
            self._capacity = capacity
            self._buckets = {}
            self._guard = threading.Lock()

        def allow(self, key):
            with self._guard:
                bucket = self._buckets.get(key)
                if bucket is None:
                    bucket = TokenBucket(self._rate, self._capacity)
                    self._buckets[key] = bucket
            return bucket.try_acquire()

        def forget(self, key):
            with self._guard:
                self._buckets.pop(key, None)
    ```

    Make these changes:
    1. Let `TokenBucket` and `KeyedLimiter` take an optional `clock` argument, a zero-argument callable that defaults to `time.monotonic`. Use it everywhere the code currently calls `time.time`, so tests can pass a fake clock.
    2. Add a `reset()` method to `TokenBucket` that refills it to capacity, and a `reset_all()` method to `KeyedLimiter` that does the same for every bucket.
    3. Make `try_acquire` raise `ValueError` when `n` is less than 1.
    4. Keep the code thread-safe.

    Return the full updated file.

