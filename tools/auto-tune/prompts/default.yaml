- domain: summarize
  id: summarize-hash-table-explainer
  prompt: |
    The passage below is a technical explanation. Read it and then complete the task at the end.

    A hash table stores key-value pairs and aims to find a value from its key in roughly constant time. It works by passing each key through a hash function, which converts the key into an integer. That integer is reduced to an index within a fixed-size array of buckets, and the value is stored in that bucket. To look up a key later, the same hash function is applied, the same index is computed, and the bucket is checked.

    Two different keys can produce the same index. This event is called a collision, and it is unavoidable because there are usually many more possible keys than buckets. The two most common strategies for handling collisions are chaining and open addressing. In chaining, each bucket holds a small list of entries, and colliding keys are appended to that list. In open addressing, a colliding key is placed in another empty bucket found by a fixed probing rule, such as checking the next slot.

    The load factor is the number of stored entries divided by the number of buckets. As the load factor rises, collisions become more frequent and lookups slow down, so most implementations resize the array when the load factor passes a threshold. Resizing requires computing new indexes for every entry, which is expensive for a single operation but cheap when averaged over many insertions.

    A good hash function distributes keys evenly across buckets, and it should be fast to compute. Hash functions that are too simple can create clusters, where many keys land in a few buckets and performance degrades toward that of a linked list. Some systems also use randomized hash seeds to make it hard for an attacker to craft keys that all collide.

    Task: Summarize the passage in about 80 words for a reader who has never programmed. Avoid technical jargon, and if you must use a term such as "collision", explain it in the same sentence.

- domain: summarize
  id: summarize-council-bike-lanes
  prompt: |
    The article below is a news report. Read it, then complete the task at the end.

    The Eastbrook City Council voted 6 to 3 on Monday to approve a permanent protected bike lane along Mill Street, a four-kilometre corridor that connects the rail station to the university campus. The lane replaces a temporary pilot that began in March and that council members have debated since the summer. Supporters said the pilot reduced collisions involving cyclists by a third, while local businesses reported that customers were still able to reach their shops.

    Opponents raised concerns about the removal of 46 on-street parking spaces. Several shop owners said the loss of parking would hurt businesses that rely on customers who drive, particularly older shoppers and those carrying heavy goods. One councillor proposed a delay to study alternative parking options in a nearby car park, but the proposal failed. The council did agree to a review in two years that will measure travel times, parking occupancy and sales at the affected shops.

    City transport staff estimated that construction will begin in the spring and take about five months. Work will include new kerbs, improved crossings at three junctions, and additional street trees. The total cost is 2.1 million dollars, of which about 800,000 dollars will come from a state active travel grant. The remaining funds will come from the city's capital budget.

    Residents who spoke at the public session were divided. A group of parents from the northern neighbourhood said the lane would make the school route safer for children. A resident of a nearby street said the design had not been explained clearly enough before the vote, and asked for more public meetings before construction begins.

    Task: Write a neutral one-paragraph summary of the decision and its context, then list the open questions that remain unresolved, as bullet points.

- domain: summarize
  id: summarize-lighthouse-story
  prompt: |
    The short story below is complete. Read it, then complete the task at the end.

    Every evening for thirty-one years, Teodora climbed the one hundred and twelve iron steps of the Carrow Point lighthouse to light the lamp. Her father had done the same, and his father before him, and by now the habit felt less like a job than a kind of breathing. The lamp needed winding and the glass needed polishing, and she did both without thinking.

    That autumn the new automatic beacon was installed on the far headland. The men who brought it talked about it kindly, the way one talks about a horse that will replace an old friend. Teodora helped them carry the crates. She did not say that she had hoped they would take longer.

    The rumour in the village was that the lighthouse would be closed by spring. Her nephew Iven, who worked the ferry, came up one evening and said she should accept the pension and move to the mainland, where his wife could look after her. Teodora said nothing, and when he left she climbed the stairs and sat in the dark at the top for a long time, watching the water turn from grey to black.

    In the last week of October, a fishing boat failed to return before the storm. Teodora lit the lamp early and kept it burning through the night, even though the automatic beacon was operating and the official instructions said she should not need to. At dawn the boat appeared at the harbour mouth, its crew waving from the stern. The harbourmaster later wrote a short report that did not mention the lamp at all.

    The following spring the lighthouse was closed. Teodora moved to the mainland, but she often told visitors that she still woke at four in the morning, listening for the sound of the winding mechanism that no longer ran.

    Task: Summarize the plot in three sentences, then state the narrator's main internal conflict in one sentence.

