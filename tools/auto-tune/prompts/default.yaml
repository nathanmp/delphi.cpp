- domain: summarize
  id: summarize-bakery-quarter
  prompt: |
    Read the report below and then follow the instruction at the end.

    Harbor Lane Bakery: Quarterly Operations Report, Q3

    Revenue for the third quarter reached 412,600 dollars, which is 9 percent above the same quarter last year. Most of the growth came from the two new wholesale accounts that began in July, a café chain on the east side and a grocery co-op in the north. Wholesale now accounts for roughly a third of total sales, up from a fifth a year ago. Walk-in sales at the original shop were flat, reflecting a slow summer for tourism along the harbour.

    Production costs rose faster than revenue. Flour prices increased by 14 percent after the spring contract renewal, and butter costs stayed high through August. The bakery absorbed part of this increase rather than passing it on, which cut the gross margin from 61 percent to 57 percent. Labour costs were stable because the team added one overnight baker in June, which also reduced overtime by about 300 hours.

    Waste fell for the first time in two years. The bakery now records unsold bread and pastries each evening, and the donation program distributed about 1,100 kilograms of day-old goods to local shelters. Staff suggested the tracking sheet, and the team has kept it running through the autumn.

    Two problems remain open. The delivery van failed its inspection in September and has been out of service for nine days, forcing the wholesale route to use a rented vehicle at a higher cost. Customer complaints about the sourdough rye also increased; most mention a dense crumb and a sharper taste than before. The head baker has traced this to a change in the supplier's flour blend and is testing an alternative.

    Priorities for the next quarter are to secure a second delivery vehicle, restore the gross margin to at least 60 percent through pricing and supplier changes, and sign one more wholesale account before the holiday season.

    Instruction: Summarize the report in no more than four sentences. Then list the three most important action items for next quarter as a numbered list.

- domain: summarize
  id: summarize-product-meeting-notes
  prompt: |
    Below are notes from a product meeting. Use them as the source for the request at the end.

    Onboarding redesign review, Tuesday 14 October. Attendees: Dana (product), Ruth (design), Omar (mobile engineering), Priya (customer success), Sam (data).

    The group reviewed the results of the two-week trial of the shorter onboarding flow. Users in the trial group completed setup in a median of four minutes, down from seven minutes in the control group. However, the seven-day retention figures were nearly identical between the groups, at 38 percent for the trial and 37 percent for the control. Sam noted that the sample of 1,200 users per group is large enough to trust the completion time result, but that the retention difference is too small to read as an effect either way.

    Priya reported that support tickets about "missing settings" rose by about 20 percent in the trial group. Several of these came from users who skipped the company-size question, which the new flow moved to the end. Ruth proposed moving that question back to the start, but as an optional field with a clear reason shown beside it. Omar cautioned that the mobile layout has a fixed step counter that would need rework if the number of screens changes again.

    Decisions: the team agreed to ship the shorter flow to all users in the first week of November, with the company-size question restored as optional. Omar will check whether the step counter can be data-driven before the release. Sam will run a follow-up analysis of retention at thirty days, not seven, because early churn in the trial was concentrated in users who never connected a bank account.

    Open items: decide whether the bank-connection step should be required, and whether the team should run a separate trial for the mobile app. Dana will bring both questions to the next planning session on 28 October.

    Request: Rewrite these notes as a short message to the company's executive team, under 120 words, in a plain and confident tone. Lead with the decision.

